<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Arivly — Нэвтэрч байна</title><p>Нэвтрэлтийг баталгаажуулж байна…</p><script>
const handle = localStorage.getItem('ExpoWebBrowserRedirectHandle');
if (handle) {
  const url = location.href;
  localStorage.setItem('ExpoWebBrowser_OriginUrl_' + handle, url);
  if (window.opener) {
    const send = () => window.opener.postMessage({expoSender: handle, url}, location.origin);
    send();
    // The redirect can arrive before Expo finishes registering its listener.
    // Repeat briefly; the parent closes this popup after receiving the result.
    const timer = setInterval(send, 500);
    setTimeout(() => clearInterval(timer), 120000);
  }
}
</script></html>
